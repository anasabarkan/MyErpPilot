services:
  # ── FastAPI application ──────────────────────
  api:
    build: .
    container_name: erp-pilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL database ──────────────────────
  db:
    image: postgres:16-alpine
    container_name: erp-pilot-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Adminer (DB management UI) ──────────────
  adminer:
    image: adminer:latest
    container_name: erp-pilot-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
