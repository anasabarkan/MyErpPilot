services:
  # ── FastAPI application ──────────────────────
  api:
    build: .
    container_name: erp-pilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - FERNET_KEY=${FERNET_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - AUTO_GENERATE_FERNET_KEY=${AUTO_GENERATE_FERNET_KEY:-false}
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL database ──────────────────────
  db:
    image: postgres:16-alpine
    container_name: erp-pilot-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Adminer (DB management UI) ──────────────
  adminer:
    image: adminer:latest
    container_name: erp-pilot-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Odoo stack for local ERP integration testing (optional profile)
  odoo-db:
    image: postgres:16-alpine
    container_name: erp-pilot-odoo-db
    profiles: ["odoo"]
    environment:
      POSTGRES_DB: ${ODOO_DB_NAME:-odoo}
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:17
    container_name: erp-pilot-odoo
    profiles: ["odoo"]
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo_data:/var/lib/odoo
    restart: unless-stopped

volumes:
  postgres_data:
  odoo_data:
  odoo_db_data:
